<div style="width: 1280px; height: 720px; position: relative; margin: 0 auto; overflow: hidden; background-color: #ffffff;">
  <!-- Header bar -->
  <div data-name="header" style="
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 72px;
    background-color: #3742fa;
  "></div>

  <!-- Title -->
  <div
    data-name="title"
    data-prompt="Slide title (3-6 words)"
    style="
      position: absolute;
      left: 60px;
      top: 18px;
      width: 1100px;
      font-size: 32px;
      font-family: 'Calibri', Arial, sans-serif;
      font-weight: bold;
      color: #ffffff;
      line-height: 1.2;
    ">
    Content Section
  </div>

  <!-- Content area -->
  <div
    data-name="content"
    data-prompt="Main content bullet points or text"
    style="
      position: absolute;
      left: 60px;
      top: 100px;
      width: 1100px;
      height: 500px;
      font-size: 24px;
      font-family: 'Calibri', Arial, sans-serif;
      color: #000000;
      line-height: 1.3;
    ">
    • This is a bullet point with important information
    • Another key point to consider in this analysis
    • The third point with additional details
    • A fourth item that provides more context
  </div>

  <!-- Slide number -->
  <div
    data-name="slide-number"
    data-prompt="Slide number (auto-generated)"
    style="
      position: absolute;
      right: 24px;
      bottom: 24px;
      font-size: 12px;
      font-family: 'Calibri', Arial, sans-serif;
      color: #666666;
    ">
    1
  </div>
</div>

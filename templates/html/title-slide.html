<div style="width: 1280px; height: 720px; position: relative; margin: 0 auto; overflow: hidden; background-color: #1e3799;">
  <!-- Background with gradient -->
  <div data-name="background" style="
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: linear-gradient(45deg, #1e3799, #0c2461);
  "></div>

  <!-- Title -->
  <div
    data-name="title"
    data-prompt="Title of the presentation (2-5 words)"
    style="
      position: absolute;
      left: 50%;
      top: 200px;
      transform: translateX(-50%);
      width: 1000px;
      font-size: 54px;
      font-family: 'Calibri', Arial, sans-serif;
      font-weight: bold;
      color: #ffffff;
      text-align: center;
      line-height: 1.2;
    ">
    Document Analysis
  </div>

  <!-- Subtitle -->
  <div
    data-name="subtitle"
    data-prompt="Subtitle of the presentation (4-8 words)"
    style="
      position: absolute;
      left: 50%;
      top: 340px;
      transform: translateX(-50%);
      width: 900px;
      font-size: 32px;
      font-family: 'Calibri', Arial, sans-serif;
      color: #ffffff;
      text-align: center;
      line-height: 1.3;
    ">
    Insights and Key Information
  </div>

  <!-- Date -->
  <div
    data-name="date"
    data-prompt="Current date (auto-generated)"
    style="
      position: absolute;
      left: 50%;
      bottom: 80px;
      transform: translateX(-50%);
      width: 600px;
      font-size: 18px;
      font-family: 'Calibri', Arial, sans-serif;
      color: #ffffff;
      text-align: center;
    ">
    17 Mar 2025
  </div>
</div>
